<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
<link rel="stylesheet" href="search.css">
</head>
<body>
  <script type="text/javascript">document.body.style.visibility="hidden";</script>
  <div id="SFctr" data-org="31002" data-mfl="64c215764c0b6076026762a3"><div style="clear:both"></div></div>
  <script type="text/javascript" src="https://cdn.membershipworks.com/mfl.js"></script>
  <div class="container">
    <div class="inputs-wrapper">
      <div class="inputs">
        <form id="searchForm" autocomplete="off">
          <div class="custom-select-container">
            <div class="custom-select-trigger" id="position-select-trigger">
              <span data-i18n="positions.goalkeeper">Goalkeeper</span>
            </div>
            <div class="custom-select-options multi-select" id="position-select-options"></div>
          </div>

          <div class="custom-select-container">
            <div class="custom-select-trigger has-icon" id="league-select-trigger">
              <iconify-icon icon="emojione:globe-showing-europe-africa" width="18" height="18"></iconify-icon>
              <span data-i18n="leagues.allLeagues">All Leagues</span>
            </div>
            <div class="custom-select-options multi-select" id="league-select-options"></div>
          </div>

          <div class="metric-row">
            <div class="custom-select-container metric-select-wrap">
              <div class="custom-select-trigger" id="metric-select-trigger">
                <span data-i18n="search.metrics">Metrics</span>
              </div>
              <div class="custom-select-options multi-select" id="metric-select-options">
                <div class="dropdown-search-wrap">
                  <input type="search" id="metricSearch" placeholder="Search metrics" data-i18n="search.metricsPlaceholder" autocomplete="off" spellcheck="false">
                </div>
                <div id="metric-select-list"></div>
              </div>
            </div>
            <div class="mode-icon-toggles">
              <div class="btn-tooltip">
                <button type="button" id="toggleTotal" class="btn btn-outline btn-icon" aria-pressed="false">
                  <i class="ion-ios-stopwatch-outline"></i>
                </button>
                <span class="btn-tooltip-text" id="toggleTotalTip" data-i18n="toggles.switchToTotal">Switch to total</span>
              </div>
              <div class="btn-tooltip">
                <button type="button" id="toggleRaw" class="btn btn-outline btn-icon" aria-pressed="false">
                  <iconify-icon icon="mdi:numeric" width="20" height="20"></iconify-icon>
                </button>
                <span class="btn-tooltip-text" id="toggleRawTip" data-i18n="toggles.switchToRaw">Switch to raw values</span>
              </div>
            </div>
          </div>

          <div id="metricSliders"></div>

          <div class="range-field dual-field">
            <div class="range-label-row">
              <label data-i18n="search.age">Age</label>
              <span class="range-readout" id="ageReadout">15 – 45</span>
            </div>
            <div class="dual-range" id="ageRange">
              <div class="dual-range-track"></div>
              <input type="range" id="ageLow" min="15" max="45" value="15" step="1">
              <input type="range" id="ageHigh" min="15" max="45" value="45" step="1">
            </div>
          </div>

          <div class="range-field dual-field">
            <div class="range-label-row">
              <label data-i18n="search.minutes">Minutes Played</label>
              <span class="range-readout" id="minutesReadout">0 – 10,000</span>
            </div>
            <div class="dual-range" id="minutesRange">
              <div class="dual-range-track"></div>
              <input type="range" id="minutesLow" min="0" max="10000" value="0" step="50">
              <input type="range" id="minutesHigh" min="0" max="10000" value="10000" step="50">
            </div>
          </div>

          <div class="quick-search-row">
            <div class="custom-select-container quick-search-wrap">
              <div class="custom-select-trigger has-search-icon" id="quick-search-trigger">
                <span data-i18n="search.quickSearch">Quick search</span>
                <i class="ion-ios-search" aria-hidden="true"></i>
              </div>
              <div class="custom-select-options" id="quick-search-options"></div>
            </div>
            <div class="btn-tooltip">
              <button type="button" id="pastSeasonBtn" class="btn btn-outline btn-icon" aria-pressed="false">
                <i class="ion-calendar"></i>
              </button>
              <span class="btn-tooltip-text" id="pastSeasonTip" data-i18n="toggles.switchToPastSeason">Switch to past season</span>
            </div>
          </div>

        </form>
      </div>
      <div class="inputs-toggle">
        <div class="inputs-toggle-icon"></div>
      </div>
    </div>

    <div class="results-panel">
      <div class="results-toolbar" id="resultsToolbar" hidden>
        <div class="results-count" id="resultsCount"></div>
        <input type="search" id="playerSearch" placeholder="Search player or team" data-i18n="search.playerPlaceholder" autocomplete="off" spellcheck="false">
      </div>
      <div id="tableWrapper">
        <div id="resultsContainer"></div>
      </div>
    </div>
  </div>

  <div class="dark-mode-toggle" onclick="toggleDarkMode()">
    <span class="toggle-icon"></span>
  </div>

  <script src="search.js"></script>
  <script src="searchhelpers.js"></script>
</body>
</html>
